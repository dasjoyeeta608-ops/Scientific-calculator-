<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Scientific Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8e8e8;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            border-radius: 15px;
            background: #222;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #f5f5f5;
            text-align: right;
            font-size: 28px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        button:hover {
            background: #555;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #e68600;
        }

        .special {
            background: #007aff;
        }

        .clear {
            background: #e74c3c;
        }

        .equal {
            background: #28a745;
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" value="0" readonly>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="special" onclick="square()">x²</button>
        <button class="special" onclick="squareRoot()">√</button>
        <button class="operator" onclick="setOperator('/')">÷</button>

        <button onclick="number(7)">7</button>
        <button onclick="number(8)">8</button>
        <button onclick="number(9)">9</button>
        <button class="operator" onclick="setOperator('*')">×</button>

        <button onclick="number(4)">4</button>
        <button onclick="number(5)">5</button>
        <button onclick="number(6)">6</button>
        <button class="operator" onclick="setOperator('-')">−</button>

        <button onclick="number(1)">1</button>
        <button onclick="number(2)">2</button>
        <button onclick="number(3)">3</button>
        <button class="operator" onclick="setOperator('+')">+</button>

        <button onclick="number(0)">0</button>
        <button onclick="decimal()">.</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>
</div>

<script>

    let display = document.getElementById("display");

    let firstNumber = null;
    let operator = null;
    let waitingForSecondNumber = false;

    function number(num) {

        if (waitingForSecondNumber) {
            display.value = num;
            waitingForSecondNumber = false;
        } else {
            if (display.value === "0") {
                display.value = num;
            } else {
                display.value += num;
            }
        }
    }

    function decimal() {

        if (waitingForSecondNumber) {
            display.value = "0.";
            waitingForSecondNumber = false;
            return;
        }

        if (!display.value.includes(".")) {
            display.value += ".";
        }
